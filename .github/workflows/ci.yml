name: CI

# PR tier is deliberately light: lint, build, schema/lefthook checks and fast
# unit tests (no -race/-cover) on one ubuntu runner. Integration, Playwright
# e2e, the cross-platform build matrix, timing and perf live in heavy.yml and run
# on release, weekly, dispatch, or a PR labelled `ci:full`.
#
# Merge gate for heavy-suite code: `evidence-gate`. Run scripts/verify-full.sh
# locally and commit .ci/evidence/full-suite.json (hash of all tracked files),
# or label the PR `ci:full`.
#
# Branch protection: required checks are "CI Validation" (unchanged) and
# "evidence-gate". Removed checks: "Build (linux/darwin x amd64/arm64)",
# "Integration Tests", "Frontend Playwright E2E", "Test Timing". Docs-only PRs
# skip this workflow (paths-ignore) so required checks would stay pending there.

on:
  push:
    branches: [main]
    paths-ignore:
      - '.ddx/**'   # tracker heartbeat commits
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'website/**'
      - 'demos/**'
      - '.ddx/**'
      - 'LICENSE*'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Minimal permissions by default
permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  # Main CI job using lefthook
  ci:
    name: CI Validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Need full history for some checks
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: 'cli/go.mod'
        cache-dependency-path: cli/go.sum

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v8
      with:
        version: v2.13.2
        working-directory: cli
        skip-cache: false

    - name: Install lefthook
      run: |
        # Download the pre-built binary rather than `go install`: lefthook's
        # own dependency graph is outside this repo's go.mod, so compiling it
        # with whichever Go toolchain actions/setup-go resolves (cli/go.mod's
        # `go` directive) can break independently of this repo's own
        # dependencies — e.g. it failed to compile under Go 1.27+ once
        # GOEXPERIMENT=jsonv2 defaulted on, the same class of break this repo
        # fixed in its own deps via the tailscale.com bump, but unfixable here
        # since we don't control lefthook's go.sum.
        version=$(curl -fsSL https://api.github.com/repos/evilmartians/lefthook/releases/latest | jq -r .tag_name | sed 's/^v//')
        curl -fsSL -o lefthook.gz "https://github.com/evilmartians/lefthook/releases/download/v${version}/lefthook_${version}_Linux_x86_64.gz"
        gunzip lefthook.gz
        chmod +x lefthook
        sudo mv lefthook /usr/local/bin/lefthook
        lefthook version

    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install root dependencies
      run: bun install --frozen-lockfile

    - name: Lint DESIGN.md
      run: bunx @google/design.md lint .stitch/DESIGN.md

    - name: Build CLI binary
      run: |
        cd cli
        make build

    - name: Validate bead schema
      run: make bead-schema

    - name: Validate readiness-checks schema
      run: make readiness-schema

    - name: Validate skill metadata
      run: make skill-schema

    - name: Validate ddx skill (agentskills.io conformance)
      run: scripts/eval-skill.sh --validate

    # PR tier: everything in `lefthook run ci` except the full -race suite
    # (heavy.yml / scripts/verify-full.sh) and lint (golangci-lint action above).
    - name: Run CI validation
      # `lefthook run --exclude` did not drop go-test-all (the -race suite ran and hit the timeout),
      # so delete those commands from a copy of the config instead.
      run: |
        yq 'del(.ci.commands.go-test-all) | del(.ci.commands.go-lint-all)' lefthook.yml > "$RUNNER_TEMP/lefthook-pr.yml"
        LEFTHOOK_CONFIG="$RUNNER_TEMP/lefthook-pr.yml" lefthook run ci
      env:
        LEFTHOOK_QUIET: meta,execution

    - name: Fast unit tests
      working-directory: cli
      # internal/agent and internal/server hold process-reaping and latency-budget
      # tests that take ~10 min and fail on hosted runners (also red on main);
      # they run in the heavy suite instead. Keep the release-workflow shape test.
      run: |
        go test -timeout 20m $(go list ./... | grep -Ev '/internal/(agent|server)$')
        go test -timeout 5m ./internal/server -run 'TestReleaseWorkflow' -count=1
      env:
        CGO_ENABLED: "1"
        SKIP_INTEGRATION_TESTS: "true"

    - name: Guard server state against test pollution
      run: |
        set -euo pipefail

        # Correctness is already validated by lefthook go-test-all above.
        # Do NOT re-run the full suite here: a second pass without -race has
        # repeatedly failed on latency-budget flakes and TempDir cleanup races
        # (e.g. TestWatchdogLoopPeriodicallyChecks) that are orthogonal to this
        # guard. This step only asserts a clean server start under an isolated
        # XDG does not materialize a polluted project registry.
        export XDG_DATA_HOME="$(mktemp -d)"

        cd cli
        ./build/ddx server --addr 127.0.0.1 --port 17743 --tsnet=false > ../ddx-state-guard-server.log 2>&1 &
        server_pid=$!
        cleanup() {
          kill "$server_pid" 2>/dev/null || true
          wait "$server_pid" 2>/dev/null || true
        }
        trap cleanup EXIT

        state_file="$XDG_DATA_HOME/ddx/server-state.json"
        for _ in $(seq 1 20); do
          if [ -f "$state_file" ]; then
            break
          fi
          sleep 0.25
        done

        if [ ! -f "$state_file" ]; then
          cat ../ddx-state-guard-server.log
          echo "server-state.json was not created"
          exit 1
        fi

        project_count="$(jq '.projects | length' "$state_file")"
        if [ "$project_count" -gt 20 ]; then
          jq '.projects[] | {name, path}' "$state_file"
          echo "server-state.json contains $project_count projects; expected <= 20"
          exit 1
        fi

        if jq -e '.projects[]? | select(.path | test("(^/tmp/|^/private/tmp/|^/var/folders/|/Test[A-Z][A-Za-z0-9_]*[0-9]+/)"))' "$state_file" >/dev/null; then
          jq '.projects[] | select(.path | test("(^/tmp/|^/private/tmp/|^/var/folders/|/Test[A-Z][A-Za-z0-9_]*[0-9]+/)")) | {name, path}' "$state_file"
          echo "server-state.json contains Go test temp-dir project entries"
          exit 1
        fi

  full:
    name: Heavy suite (ci:full)
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:full')
    uses: ./.github/workflows/heavy.yml
    with:
      scope: full

  # Cheap gate (seconds): proves the heavy suite was run for this exact tree.
  # Passes if (a) .ci/evidence/full-suite.json matches the PR head content hash
  # (produced by scripts/verify-full.sh), OR (b) PR has label `ci:full` and the
  # heavy job passed, OR (c) the diff touches no path the heavy suite covers.
  evidence-gate:
    name: evidence-gate
    if: always() && github.event_name == 'pull_request'
    needs: [full]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Check evidence
        env:
          FULL_RESULT: ${{ needs.full.result }}
          BASE_REF: ${{ github.base_ref }}
          HEAVY_RE: '^(cli/|scripts/|lefthook\.yml|Makefile|\.golangci)'
        run: |
          set -euo pipefail
          changed=$(git diff --name-only "origin/${BASE_REF}...HEAD" | grep -Ev '^(scripts/verify-full\.sh|\.ci/evidence/|cli/internal/server/release_workflow_test\.go$)' || true)
          if ! grep -Eq "$HEAVY_RE" <<<"$changed"; then
            echo "No heavy-suite paths changed; gate passes."; exit 0
          fi
          if [[ "$FULL_RESULT" == "success" ]]; then
            echo "ci:full label set and heavy suite passed; gate passes."; exit 0
          fi
          f=.ci/evidence/full-suite.json
          if [[ -f "$f" ]]; then
            want=$(jq -r .content_hash "$f")
            have=$(bash scripts/verify-full.sh --hash-only)
            if [[ "$want" == "$have" ]]; then
              echo "Evidence matches ($(jq -r '.suite + " @ " + .timestamp' "$f")); gate passes."; exit 0
            fi
            echo "::error::Evidence is stale (recorded $want, tree is $have). Re-run scripts/verify-full.sh and commit."
          else
            echo "::error::No $f. Run scripts/verify-full.sh and commit the evidence, or add the 'ci:full' label."
          fi
          exit 1
